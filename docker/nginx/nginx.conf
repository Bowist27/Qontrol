events {
    worker_connections 1024;
}

http {
    upstream auth_backend {
        server auth-service:8080;
    }

    upstream audit_backend {
        server audit-service:8081;
    }

    # Use map instead of if-set (avoids nginx "if is evil" issues)
    # Validates origin and reflects it back for CORS
    map $http_origin $cors_origin {
        default                           $http_origin;
        ''                                '*';
    }

    # Local development server (port 80)
    # Also handles production if Cloudflare uses Flexible SSL
    server {
        listen 80 default_server;
        server_name localhost api.qontroll.uk;

        # Auth Service Endpoints
        location /api/auth/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
