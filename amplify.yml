version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd apps/web-admin
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: apps/web-admin/dist
    files:
      - '**/*'
  cache:
    paths:
      - apps/web-admin/node_modules/**/*
customRules:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|woff2?)$)([^.]+$)/>'
    target: /index.html
    status: '200'
